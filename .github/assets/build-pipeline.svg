<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">How genoffice-nix turns an upstream release into Nix packages</title>
<desc id="d">The latest upstream GenOffice release tag enters nix build in the Nix sandbox, which applies the test patches, builds docs, sheets, slides, pdf, markdown and html plus the Rust xlsx sidecar, and runs the upstream test suite. It produces genoffice-app, the Electron desktop app, and genoffice, the command-line interface. A daily workflow repeats this for each new tag and opens a pull request.</desc>
<style>
:root{--bg:#F2F5FA;--panel:#FFFFFF;--ink:#1A2440;--muted:#5B6785;--line:#C9D3E3;--accent:#4A6FBF;--soft:#DCE6F7;--ok:#23856B;--on-ok:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0E1730;--panel:#16213F;--ink:#E3EAF7;--muted:#97A5C6;--line:#2F3D63;--accent:#7EB0E8;--soft:#1F2F58;--ok:#4CC79F;--on-ok:#0E1730}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.muted{fill:var(--muted)}
.small{font-size:12px}
.tiny{font-size:10.5px}
.b{font-weight:650}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.25}
.box{fill:var(--soft);stroke:var(--accent);stroke-width:1.25;stroke-opacity:.55}
.wire{fill:none;stroke:var(--line);stroke-width:2}
.track{fill:var(--line);opacity:.55}
.fill{fill:var(--accent);transform-box:fill-box;transform-origin:left center}
.ring{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.done circle{fill:var(--ok)}
.done path{fill:none;stroke:var(--on-ok);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lit{fill:none;stroke:var(--accent);stroke-width:2}
.pkt circle:first-child{fill:var(--accent);opacity:.25}
.pkt circle:last-child{fill:var(--accent)}
.pkt{opacity:0}
.loop{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5}
.flow{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;opacity:0}
.head{fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){
.anim *,.anim{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.25,1);animation-fill-mode:both}
#pin{animation-name:pin}
#pa{animation-name:pa}#pb{animation-name:pb}
#f1{animation-name:f1}#f3{animation-name:f3}
#s1{animation-name:s1}#s2{animation-name:s2}#s3{animation-name:s3}#s4{animation-name:s4}#s5{animation-name:s5}#s6{animation-name:s6}
#c1{animation-name:c1}#c2{animation-name:c2}#c3{animation-name:c3}#c4{animation-name:c4}
#l1,#l2{animation-name:lit}
#flow{animation-name:flow;animation-timing-function:linear}
#tag{animation-name:tag}
}
@keyframes pin{0%{opacity:0;transform:translate(0,0)}1%{opacity:1}8%{opacity:1}9.5%{opacity:0;transform:translate(70px,0)}100%{opacity:0;transform:translate(70px,0)}}
@keyframes pa{0%,65%{opacity:0;transform:translate(0,0)}66%{opacity:1}74%{opacity:1}76%,100%{opacity:0;transform:translate(60px,-46px)}}
@keyframes pb{0%,65%{opacity:0;transform:translate(0,0)}66%{opacity:1}74%{opacity:1}76%,100%{opacity:0;transform:translate(60px,46px)}}
@keyframes tag{0%{opacity:1}3%{opacity:.4}9%,100%{opacity:1}}
@keyframes f1{0%,9%{transform:scaleX(0);opacity:1}19%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes s1{0%,19%{transform:scaleX(0);opacity:1}23.5%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes s2{0%,23.5%{transform:scaleX(0);opacity:1}28%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes s3{0%,28%{transform:scaleX(0);opacity:1}32.5%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes s4{0%,32.5%{transform:scaleX(0);opacity:1}37%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes s5{0%,37%{transform:scaleX(0);opacity:1}41.5%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes s6{0%,41.5%{transform:scaleX(0);opacity:1}46%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes f3{0%,46%{transform:scaleX(0);opacity:1}66%,94%{transform:scaleX(1);opacity:1}99%{transform:scaleX(1);opacity:0}100%{transform:scaleX(0);opacity:0}}
@keyframes c1{0%,19%{opacity:0}20.5%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes c2{0%,46%{opacity:0}47.5%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes c3{0%,66%{opacity:0}67.5%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes c4{0%,76%{opacity:0}78%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes lit{0%,75%{opacity:0}77.5%,94%{opacity:1}99%,100%{opacity:0}}
@keyframes flow{0%,80%{stroke-dashoffset:100;opacity:0}81%{opacity:1}92%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
</style>
<rect width="1000" height="380" rx="18" fill="var(--bg)"/>

<g class="anim">
<path class="wire" d="M216 168H290"/>
<path class="wire" d="M710 168L770 122M710 168L770 214"/>

<path class="loop" d="M873 250V334H120V222"/>
<path class="head" d="M114 228L120 218L126 228Z"/>
<path id="flow" class="flow" pathLength="100" d="M873 250V334H120V222"/>
<text x="496" y="362" text-anchor="middle" class="muted small">A daily workflow picks up each new upstream tag, builds and tests it, and opens a pull request</text>

<rect class="panel" x="24" y="120" width="192" height="96" rx="12"/>
<text x="42" y="146" class="muted small">Upstream release</text>
<text x="42" y="171" class="mono small">genspark-ai/genoffice</text>
<g id="tag"><rect x="42" y="184" width="112" height="22" rx="11" fill="var(--soft)" stroke="var(--accent)" stroke-opacity=".55"/>
<text x="98" y="199.5" text-anchor="middle" class="mono small">latest v* tag</text></g>

<rect class="box" x="290" y="48" width="420" height="240" rx="18"/>
<text x="318" y="80"><tspan class="mono b" font-size="14">nix build</tspan><tspan class="muted" dx="8">in the Nix sandbox, offline</tspan></text>

<circle class="ring" cx="330" cy="114" r="9"/>
<g id="c1" class="done"><circle cx="330" cy="114" r="9"/><path d="M326 114.5l2.7 2.7 5-5.4"/></g>
<text x="356" y="118">Apply the upstream test patches</text>
<rect class="track" x="356" y="128" width="330" height="6" rx="3"/>
<rect id="f1" class="fill" x="356" y="128" width="330" height="6" rx="3"/>

<circle class="ring" cx="330" cy="170" r="9"/>
<g id="c2" class="done"><circle cx="330" cy="170" r="9"/><path d="M326 170.5l2.7 2.7 5-5.4"/></g>
<text x="356" y="174">Build every app and the Rust xlsx sidecar</text>
<g>
<rect class="track" x="356" y="184" width="51.67" height="6" rx="3"/><rect class="track" x="411.67" y="184" width="51.67" height="6" rx="3"/><rect class="track" x="467.33" y="184" width="51.67" height="6" rx="3"/><rect class="track" x="523" y="184" width="51.67" height="6" rx="3"/><rect class="track" x="578.67" y="184" width="51.67" height="6" rx="3"/><rect class="track" x="634.33" y="184" width="51.67" height="6" rx="3"/>
<rect id="s1" class="fill" x="356" y="184" width="51.67" height="6" rx="3"/><rect id="s2" class="fill" x="411.67" y="184" width="51.67" height="6" rx="3"/><rect id="s3" class="fill" x="467.33" y="184" width="51.67" height="6" rx="3"/><rect id="s4" class="fill" x="523" y="184" width="51.67" height="6" rx="3"/><rect id="s5" class="fill" x="578.67" y="184" width="51.67" height="6" rx="3"/><rect id="s6" class="fill" x="634.33" y="184" width="51.67" height="6" rx="3"/>
</g>
<g>
<text x="381.83" y="205" text-anchor="middle" class="mono tiny muted">docs</text><text x="437.50" y="205" text-anchor="middle" class="mono tiny muted">sheets</text><text x="493.16" y="205" text-anchor="middle" class="mono tiny muted">slides</text><text x="548.83" y="205" text-anchor="middle" class="mono tiny muted">pdf</text><text x="604.50" y="205" text-anchor="middle" class="mono tiny muted">markdown</text><text x="660.16" y="205" text-anchor="middle" class="mono tiny muted">html</text>
</g>

<circle class="ring" cx="330" cy="240" r="9"/>
<g id="c3" class="done"><circle cx="330" cy="240" r="9"/><path d="M326 240.5l2.7 2.7 5-5.4"/></g>
<text x="356" y="244">Run the full upstream test suite</text>
<rect class="track" x="356" y="254" width="330" height="6" rx="3"/>
<rect id="f3" class="fill" x="356" y="254" width="330" height="6" rx="3"/>

<rect class="panel" x="770" y="86" width="206" height="72" rx="12"/>
<rect id="l1" class="lit" x="770" y="86" width="206" height="72" rx="12"/>
<text x="790" y="116" class="mono b" font-size="14">genoffice-app</text>
<text x="790" y="138" class="muted small">Electron desktop app</text>

<rect class="panel" x="770" y="178" width="206" height="72" rx="12"/>
<rect id="l2" class="lit" x="770" y="178" width="206" height="72" rx="12"/>
<text x="790" y="208" class="mono b" font-size="14">genoffice</text>
<text x="790" y="230" class="muted small">Command-line interface</text>

<g id="c4" class="done"><circle cx="950" cy="112" r="9"/><path d="M946 112.5l2.7 2.7 5-5.4"/><circle cx="950" cy="204" r="9"/><path d="M946 204.5l2.7 2.7 5-5.4"/></g>

<g id="pin" class="pkt"><circle cx="222" cy="168" r="9"/><circle cx="222" cy="168" r="4.5"/></g>
<g id="pa" class="pkt"><circle cx="710" cy="168" r="9"/><circle cx="710" cy="168" r="4.5"/></g>
<g id="pb" class="pkt"><circle cx="710" cy="168" r="9"/><circle cx="710" cy="168" r="4.5"/></g>
